name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: 'npm' }
      - run: npm ci
      - run: npm run lint

  # ── Tests unitaires ─────────────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: 'npm' }
      - run: npm ci
      - run: npm run test:unit
      - name: Rapport de couverture
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

  # ── Tests d'intégration ─────────────────────────────────────────────────────
  integration-tests:
    name: 🔗 Tests d'intégration
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: 'npm' }
      - run: npm ci
      - name: Appliquer le schéma
        run: psql postgresql://user:password@localhost:5432/testdb -f init.sql
        if: hashFiles('init.sql') != ''
      - run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_NAME: testdb
          DB_USER: user
          DB_PASSWORD: password

  # ── Build Docker ─────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: api-alma:${{ github.sha }}

  # ── Déploiement (main uniquement) ────────────────────────────────────────────
  deploy:
    name: 🚀 Déployer
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Déploiement sur le serveur
        run: echo "🚀 Déploiement en production — ajouter ici vos étapes (SSH, Kubernetes, etc.)"
